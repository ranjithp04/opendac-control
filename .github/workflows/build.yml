# Builds the desktop app for macOS and Windows.
# Runs only on version tags (v*) or by hand (Actions tab → build → Run workflow),
# to stay inside the free monthly Actions minutes of a private repo.
# Builds are unsigned (see README: first-launch steps on macOS / SmartScreen on Windows).
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the files to the GitHub release on tag builds

jobs:
  # Checks first, so a tag never ships bundles from a tree whose tests fail.
  # `cargo test --workspace` also compiles g6-cli, which the app build skips.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Rust checks
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: UI type check
        working-directory: app/ui
        run: |
          npm ci
          npm run check

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install UI dependencies
        working-directory: app/ui
        run: npm ci

      - name: Build app
        working-directory: app/ui
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Collect files
        shell: bash
        run: |
          shopt -s nullglob
          mkdir out
          cp target/release/bundle/dmg/*.dmg target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi out/
          # Standalone Windows exe: copy anywhere and run (needs WebView2, built into Windows 11).
          if [ -f target/release/opendac-control.exe ]; then
            cp target/release/opendac-control.exe "out/OpenDAC-Control-portable.exe"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: opendac-control-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Both jobs try to create the draft release; the second create fails harmlessly.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "OpenDAC Control $GITHUB_REF_NAME" \
                 --notes "Unsigned builds. macOS: right-click the app, Open. Windows: SmartScreen, More info, Run anyway." \
            || true
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
