[package]
name = "opendac-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Menu bar app for the Creative Sound BlasterX G6"
build = "build.rs"

[lib]
name = "opendac_control_app"

[[bin]]
name = "opendac-control"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
g6-core = { path = "../../crates/g6-core" }
tauri = { version = "2.12.6", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
tauri-plugin-global-shortcut = "2.4.1"

# CFString for the CoreAudio mixer (already in the lockfile through Tauri).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# Core Audio (WASAPI) for the Windows mixer (already in the lockfile through Tauri).
[target.'cfg(windows)'.dependencies]
# `#[implement]` expands to paths in `windows_core`.
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
serde_json = "1.0.154"
